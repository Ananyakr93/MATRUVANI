[project]
name = "matruvani-backend"
version = "0.2.0"
description = "MATRUVANI — AI-powered perinatal mental health screening backend for ASHA workers in rural India"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

dependencies = [
    "flask>=3.1",
    "flask-cors>=5.0",
    "python-dotenv>=1.1",
    "reportlab>=4.5",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
